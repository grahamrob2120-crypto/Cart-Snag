name: Frontend smoke checks
on:
  push:
    branches: [cart-snag-foundation-2026-11-03]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing static frontend
        run: python scripts/smoke_check.py
